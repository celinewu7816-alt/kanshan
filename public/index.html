<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>看山</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- 注意：server.mjs 的 CSP 是 style-src 'self'，内联 style 属性会被拦，样式全走 styles.css -->
    <main id="stage" class="stage"></main>

    <div id="dock" class="dock" hidden>
      <button id="who" class="ghost" type="button"></button>
      <button id="panel-toggle" class="ghost" type="button">运行记录</button>
    </div>

    <section id="panel" class="panel" hidden>
      <div class="panel-head">
        <strong>OAuth 用户接口运行记录</strong>
        <button id="panel-close" class="ghost" type="button">收起</button>
      </div>
      <p id="panel-summary" class="panel-summary">尚未运行</p>
      <div id="panel-grid" class="panel-grid"></div>
      <div class="panel-actions">
        <button id="run-all" class="ghost" type="button">再跑一次</button>
        <button id="logout" class="ghost danger" type="button">退出登录</button>
      </div>
    </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
